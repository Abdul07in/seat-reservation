spring:
  application:
    name: seat-reservation
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/seat_reservation_test}
    username: ${DATABASE_USERNAME:seat_reservation}
    password: ${DATABASE_PASSWORD:seat_reservation}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ${DB_POOL_NAME:SeatReservationPool}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  security:
    jwt:
      secret: ${JWT_SECRET:local-development-secret-change-before-deployment}
      issuer: ${JWT_ISSUER:seat-reservation}
app:
  bootstrap-admin:
    identifier: ${ADMIN_IDENTIFIER:admin}
    password: ${ADMIN_PASSWORD:admin123}

server:
  error:
    include-message: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} trace_id=%X{traceId} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
