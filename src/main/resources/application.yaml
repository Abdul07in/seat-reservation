spring:
  application:
    name: seat-reservation
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/seat_reservation}
    username: ${DATABASE_USERNAME:seat_reservation}
    password: ${DATABASE_PASSWORD:seat_reservation}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  security:
    jwt:
      secret: ${JWT_SECRET:local-development-secret-change-before-deployment}
      issuer: ${JWT_ISSUER:seat-reservation}
app:
  bootstrap-admin:
    identifier: ${ADMIN_IDENTIFIER:admin}
    password: ${ADMIN_PASSWORD:admin123}

server:
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
